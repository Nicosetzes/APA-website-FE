name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # El script de lint incluye --ext .js,.jsx: sin eso ESLint ignora los
      # containers, que son casi todos .jsx.
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --watchAll=false
      - name: Build
        run: npm run build
        env:
          # Con CI=true, Create React App trata los warnings de lint como
          # errores. Verificado que hoy el build compila limpio bajo esa regla.
          CI: true
